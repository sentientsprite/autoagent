<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Nemo options</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; max-width: 480px; }
    button { padding: 8px 12px; }
  </style>
</head>
<body>
  <h1>Nemo Growth Coach — options</h1>
  <p>This extension stores only the pairing token. No analytics data is ever stored locally; everything flows through your Nemo workspace.</p>
  <button id="signout">Disconnect this extension</button>
  <script>
    document.getElementById("signout").addEventListener("click", async () => {
      await chrome.storage.sync.remove("nemo.session_token");
      alert("Disconnected.");
    });
  </script>
</body>
</html>
