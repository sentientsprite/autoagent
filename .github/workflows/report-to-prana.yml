name: Report status to Prana trunk

# Runs nightly + on demand. Reads .prana/component.yaml, gathers
# autoagent-specific metrics (SkillEval scores from tasks/, plus
# nemo-saas Phase-4 scaffold liveness), and opens a [status] Issue
# on sentientsprite/NEMO-APP-v.1.
#
# Required secret in this repo: PRANA_TRUNK_TOKEN (fine-grained PAT,
# Issues: read+write on sentientsprite/NEMO-APP-v.1).

on:
  schedule:
    - cron: '0 7 * * *'    # 07:00 UTC ≈ midnight Mountain
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --no-save js-yaml

      - name: Compose autoagent status
        id: compose
        run: |
          node <<'EOF' > /tmp/payload.json
          const fs = require('fs');
          const yaml = require('js-yaml');
          const { execSync } = require('child_process');

          const manifest = yaml.load(fs.readFileSync('.prana/component.yaml', 'utf8'));
          const id = manifest.id;

          const metrics = {};

          // Commit activity
          try {
            metrics.commits_24h = parseInt(
              execSync('git log --since=1.day --oneline | wc -l', { encoding: 'utf8' }).trim()
            );
          } catch (e) { metrics.commits_24h = 0; }

          // SkillEval surface — count task cases by skill
          try {
            const skills = fs.readdirSync('tasks').filter(d => {
              try { return fs.statSync('tasks/' + d).isDirectory() && d !== '_shared'; } catch (e) { return false; }
            });
            metrics.skilleval_skills = skills.length;
            metrics.skilleval_cases = skills.reduce((acc, s) => {
              try {
                return acc + fs.readdirSync('tasks/' + s).filter(c => c.startsWith('case_')).length;
              } catch (e) { return acc; }
            }, 0);
          } catch (e) {
            metrics.skilleval_skills = 0;
            metrics.skilleval_cases = 0;
          }

          // Phase 4 scaffold liveness — does nemo-saas/ exist with package.json?
          metrics.phase4_scaffold_present = fs.existsSync('nemo-saas/package.json');

          // Determine state. autoagent is "green" as long as the harness exists
          // and SkillEval has ≥ 1 case per declared skill. Yellow if
          // any skill has zero cases. Red if the harness file is missing.
          let state = 'green';
          let summary = `${metrics.skilleval_skills} skills with ${metrics.skilleval_cases} total cases. ${metrics.commits_24h} commits/24h.`;
          if (!fs.existsSync('agent.py')) {
            state = 'red';
            summary = 'agent.py missing — harness broken';
          } else if (metrics.skilleval_skills === 0) {
            state = 'yellow';
            summary = 'No SkillEval cases registered yet.';
          }

          const now = new Date();
          const date = now.toISOString().split('T')[0];
          const title = `[status] ${id} — ${date}`;
          const body = [
            '### Component ID', id, '',
            '### State', state, '',
            '### Summary', summary, '',
            '### Metrics (JSON)', '```json', JSON.stringify(metrics, null, 2), '```', '',
            '### Links',
            `- [This run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`,
            '',
            '### Notes', '(auto-generated by report-to-prana.yml)', '',
            '### Reporting window start (ISO 8601)',
            new Date(now.getTime() - 24 * 3600 * 1000).toISOString(), '',
            '### Reporting window end (ISO 8601)',
            now.toISOString(),
          ].join('\n');

          console.log(JSON.stringify({ title, body }));
          EOF
          TITLE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/payload.json', 'utf8')).title)")
          BODY=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/payload.json', 'utf8')).body)")
          {
            echo "title<<__EOT__"
            echo "$TITLE"
            echo "__EOT__"
            echo "body<<__EOT__"
            echo "$BODY"
            echo "__EOT__"
          } >> $GITHUB_OUTPUT

      - name: Open issue on trunk
        env:
          GH_TOKEN: ${{ secrets.PRANA_TRUNK_TOKEN }}
        run: |
          set -euo pipefail
          gh issue create \
            --repo sentientsprite/NEMO-APP-v.1 \
            --title "${{ steps.compose.outputs.title }}" \
            --body "${{ steps.compose.outputs.body }}" \
            --label component-status
