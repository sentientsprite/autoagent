name: Report status to Prana trunk

# Reads .prana/component.yaml; gathers SkillEval + nemo-saas scaffold metrics;
# opens a [status] Issue on sentientsprite/NEMO-APP-v.1 via REST (no gh CLI).
#
# Secret: PRANA_TRUNK_TOKEN — fine-grained PAT, Issues read/write on NEMO-APP-v.1 only.
# Setup: NEMO-APP-v.1/docs/TRUNK_LOOP_SETUP.md

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install --no-save js-yaml

      - name: Open status issue on trunk
        uses: actions/github-script@v7
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        with:
          github-token: ${{ secrets.PRANA_TRUNK_TOKEN }}
          script: |
            const fs = require("fs");
            const yaml = require("js-yaml");
            const { execSync } = require("child_process");

            const manifest = yaml.load(fs.readFileSync(".prana/component.yaml", "utf8"));
            const id = manifest.id;
            if (!id) throw new Error("Missing id in .prana/component.yaml");

            const metrics = {};

            try {
              metrics.commits_24h = parseInt(
                execSync("git log --since=1.day --oneline | wc -l", { encoding: "utf8" }).trim(),
                10
              );
            } catch (e) {
              metrics.commits_24h = 0;
            }

            try {
              const skills = fs.readdirSync("tasks").filter((d) => {
                try {
                  return fs.statSync("tasks/" + d).isDirectory() && d !== "_shared";
                } catch (e) {
                  return false;
                }
              });
              metrics.skilleval_skills = skills.length;
              metrics.skilleval_cases = skills.reduce((acc, s) => {
                try {
                  return acc + fs.readdirSync("tasks/" + s).filter((c) => c.startsWith("case_")).length;
                } catch (e) {
                  return acc;
                }
              }, 0);
            } catch (e) {
              metrics.skilleval_skills = 0;
              metrics.skilleval_cases = 0;
            }

            metrics.phase4_scaffold_present = fs.existsSync("nemo-saas/package.json");

            let state = "green";
            let summary = `${metrics.skilleval_skills} skills with ${metrics.skilleval_cases} total cases. ${metrics.commits_24h} commits/24h.`;
            if (!fs.existsSync("agent.py")) {
              state = "red";
              summary = "agent.py missing — harness broken";
            } else if (metrics.skilleval_skills === 0) {
              state = "yellow";
              summary = "No SkillEval cases registered yet.";
            }

            const now = new Date();
            const windowStart = new Date(now.getTime() - 24 * 3600 * 1000).toISOString();
            const windowEnd = now.toISOString();
            const date = now.toISOString().split("T")[0];
            const title = `[status] ${id} — ${date}`;
            const body = [
              "### Component ID",
              id,
              "",
              "### State",
              state,
              "",
              "### Summary",
              summary,
              "",
              "### Metrics (JSON)",
              "```json",
              JSON.stringify(metrics, null, 2),
              "```",
              "",
              "### Links",
              `- [This run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`,
              "",
              "### Notes",
              "(auto-generated by report-to-prana.yml — autoagent SkillEval + Phase 4 scaffold)",
              "",
              "### Reporting window start (ISO 8601)",
              windowStart,
              "",
              "### Reporting window end (ISO 8601)",
              windowEnd,
            ].join("\n");

            await github.rest.issues.create({
              owner: "sentientsprite",
              repo: "NEMO-APP-v.1",
              title,
              body,
              labels: ["component-status"],
            });
